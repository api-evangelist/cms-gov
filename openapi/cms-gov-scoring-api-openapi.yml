openapi: 3.2.0
info:
  title: CMS Quality Payment Program Scoring API
  description: 'The Quality Payment Program (QPP) API supports MIPS and Advanced APMs under MACRA.

    Exposes measures, benchmarks, scoring, and submission endpoints used by Qualified

    Registries, EHR vendors, and QCDRs.

    '
  version: '1.0'
  license:
    name: Public Domain (U.S. Government Work)
    url: https://www.usa.gov/government-works
servers:
- url: https://qpp.cms.gov/api
  description: Production
security:
- BearerAuth: []
tags:
- name: Scoring
paths:
  /scoring:
    get:
      summary: Get Score Preview
      operationId: getScore
      tags:
      - Scoring
      parameters:
      - name: submissionId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Score preview
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: QPP uses HARP-issued JWT bearer tokens.
