openapi: 3.2.0
info:
  title: CMS Medicare Coverage Database LCD API
  description: 'The Medicare Coverage Database (MCD) exposes National Coverage Determinations (NCDs),

    Local Coverage Determinations (LCDs), Local Coverage Articles, Proposed Decisions,

    National Coverage Analyses, and MEDCAC records.

    '
  version: '1.0'
  license:
    name: Public Domain (U.S. Government Work)
    url: https://www.usa.gov/government-works
servers:
- url: https://www.cms.gov/medicare-coverage-database/api
  description: Production
tags:
- name: LCD
paths:
  /lcds:
    get:
      summary: Search Local Coverage Determinations
      operationId: searchLCDs
      tags:
      - LCD
      parameters:
      - name: keyword
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
      - name: contractor
        in: query
        schema:
          type: string
      - name: hcpcsCode
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Matching LCDs
  /lcds/{lcdId}:
    get:
      summary: Get LCD
      operationId: getLCD
      tags:
      - LCD
      parameters:
      - name: lcdId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: LCD record
