openapi: 3.2.0
info:
  title: CMS Quality Payment Program Measurements API
  description: 'The Quality Payment Program (QPP) API supports MIPS and Advanced APMs under MACRA.

    Exposes measures, benchmarks, scoring, and submission endpoints used by Qualified

    Registries, EHR vendors, and QCDRs.

    '
  version: '1.0'
  license:
    name: Public Domain (U.S. Government Work)
    url: https://www.usa.gov/government-works
servers:
- url: https://qpp.cms.gov/api
  description: Production
security:
- BearerAuth: []
tags:
- name: Measurements
paths:
  /measurements:
    get:
      summary: List Measurements
      operationId: listMeasurements
      tags:
      - Measurements
      responses:
        '200':
          description: List of measurements
    post:
      summary: Create Measurement
      operationId: createMeasurement
      tags:
      - Measurements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Measurement created
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: QPP uses HARP-issued JWT bearer tokens.
