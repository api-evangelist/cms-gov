openapi: 3.2.0
info:
  title: CMS Medicare Coverage Database NCD API
  description: 'The Medicare Coverage Database (MCD) exposes National Coverage Determinations (NCDs),

    Local Coverage Determinations (LCDs), Local Coverage Articles, Proposed Decisions,

    National Coverage Analyses, and MEDCAC records.

    '
  version: '1.0'
  license:
    name: Public Domain (U.S. Government Work)
    url: https://www.usa.gov/government-works
servers:
- url: https://www.cms.gov/medicare-coverage-database/api
  description: Production
tags:
- name: NCD
paths:
  /ncds:
    get:
      summary: Search National Coverage Determinations
      operationId: searchNCDs
      tags:
      - NCD
      parameters:
      - name: keyword
        in: query
        schema:
          type: string
      - name: hcpcsCode
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - active
          - retired
          - pending
      responses:
        '200':
          description: Matching NCDs
  /ncds/{ncdId}:
    get:
      summary: Get NCD
      operationId: getNCD
      tags:
      - NCD
      parameters:
      - name: ncdId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: NCD record
